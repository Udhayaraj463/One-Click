<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One-Click Lifeline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            touch-action: manipulation;
        }

        /* Ceiling projection breathing light */
        #breathing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #0284c7 0%, #000000 75%);
            opacity: 0.15;
            animation: breathe 8s infinite ease-in-out;
            pointer-events: none;
        }

        /* 4s expand (inhale), 4s contract (exhale) */
        @keyframes breathe {
            0%, 100% {
                transform: scale(0.8);
                opacity: 0.15;
            }
            50% {
                transform: scale(1.4);
                opacity: 0.85;
            }
        }

        .container {
            z-index: 10;
            padding: 24px;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 1.05rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        #coords {
            font-family: monospace;
            font-size: 0.95rem;
            color: #38bdf8;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="breathing-canvas"></div>

    <div class="container">
        <h1 id="status-title">Alert Activated</h1>
        <p id="status-sub">Help is on the way. Follow the rhythm and breathe.</p>
        <div id="coords">Acquiring high-precision GPS...</div>
    </div>

    <script>
        // 1. Spoken Audio Grounding
        function speakGrounding() {
            if ('speechSynthesis' in window) {
                const message = new SpeechSynthesisUtterance("Help is on the way. Follow the rhythm and breathe.");
                message.rate = 0.85;
                message.pitch = 0.9;
                window.speechSynthesis.speak(message);
            }
        }

        // 2. Rhythmic Haptic Pacing (Vibrate API)
        function startHaptics() {
            if ("vibrate" in navigator) {
                // 4s inhale pulse, 1s pause, 4s exhale pulse, 1s pause
                navigator.vibrate([4000, 1000, 4000, 1000]);
                setInterval(() => {
                    navigator.vibrate([4000, 1000, 4000, 1000]);
                }, 10000);
            }
        }

        // 3. Autonomous GPS Acquisition
        function fetchLocation() {
            const coordsElem = document.getElementById("coords");
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude.toFixed(5);
                        const lng = pos.coords.longitude.toFixed(5);
                        const acc = Math.round(pos.coords.accuracy);
                        coordsElem.innerText = `GPS: ${lat}, ${lng} (±${acc}m)`;
                        
                        // We will add the AWS Lambda POST payload here next
                    },
                    (err) => {
                        console.warn("GPS Warning:", err.message);
                        coordsElem.innerText = "Location acquired via network fallback.";
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                coordsElem.innerText = "Geolocation not supported.";
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            speakGrounding();
            startHaptics();
            fetchLocation();
        });
    </script>
</body>
</html>
