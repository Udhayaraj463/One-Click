<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One-Click Lifeline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            touch-action: manipulation;
        }

        /* Fullscreen pulsing projection canvas */
        #breathing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #0284c7 0%, #000000 75%);
            opacity: 0.15;
            animation: breathe 8s infinite ease-in-out;
            pointer-events: none;
        }

        /* 4s expand (inhale), 4s contract (exhale) */
        @keyframes breathe {
            0%, 100% {
                transform: scale(0.8);
                opacity: 0.15;
            }
            50% {
                transform: scale(1.4);
                opacity: 0.85;
            }
        }

        .container {
            z-index: 10;
            padding: 24px;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 1.05rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        #coords {
            font-family: monospace;
            font-size: 0.95rem;
            color: #38bdf8;
            margin-top: 10px;
        }

        #dispatch-status {
            font-size: 0.85rem;
            color: #10b981;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div id="breathing-canvas"></div>

    <div class="container">
        <h1 id="status-title">Alert Activated</h1>
        <p id="status-sub">Help is on the way. Follow the rhythm and breathe.</p>
        <div id="coords">Acquiring live location...</div>
        <div id="dispatch-status"></div>
    </div>

    <script>
        // Set fallback coordinates
        const FALLBACK_LAT = 25.042309;
        const FALLBACK_LNG = 121.5684554;

        // Replace with your backend or Firebase URL when ready
        const BACKEND_ENDPOINT = "YOUR_BACKEND_ENDPOINT_URL";

        // 1. Spoken Audio Grounding
        function speakGrounding() {
            if ('speechSynthesis' in window) {
                const message = new SpeechSynthesisUtterance("Help is on the way. Follow the rhythm and breathe.");
                message.rate = 0.85;
                message.pitch = 0.9;
                window.speechSynthesis.speak(message);
            }
        }

        // 2. Rhythmic Haptic Pacing (Vibrate API)
        function startHaptics() {
            if ("vibrate" in navigator) {
                navigator.vibrate([4000, 1000, 4000, 1000]);
                setInterval(() => {
                    navigator.vibrate([4000, 1000, 4000, 1000]);
                }, 10000);
            }
        }

        // 3. Dispatch Alert Payload
        async function triggerDispatch(lat, lng, accuracy, source) {
            const dispatchStatusElem = document.getElementById("dispatch-status");
            const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;

            const payload = {
                status: "EMERGENCY_TRIGGERED",
                timestamp: new Date().toISOString(),
                location: {
                    latitude: lat,
                    longitude: lng,
                    accuracyMeters: accuracy,
                    source: source,
                    directionsUrl: navUrl
                }
            };

            console.log("Dispatch Payload:", payload);

            if (BACKEND_ENDPOINT !== "YOUR_BACKEND_ENDPOINT_URL") {
                try {
                    const response = await fetch(BACKEND_ENDPOINT, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        dispatchStatusElem.innerText = "Dispatch Signal: Sent";
                    } else {
                        dispatchStatusElem.innerText = "Dispatch Signal: Server Error";
                    }
                } catch (err) {
                    console.warn("Dispatch request failed:", err);
                    dispatchStatusElem.innerText = "Dispatch Signal: Offline Logged";
                }
            } else {
                dispatchStatusElem.innerText = "Local Mode (Backend URL not configured)";
            }
        }

        // 4. Autonomous GPS Location Retrieval
        function fetchLocation() {
            const coordsElem = document.getElementById("coords");

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        const acc = Math.round(pos.coords.accuracy);

                        coordsElem.innerText = `GPS: ${lat.toFixed(5)}, ${lng.toFixed(5)} (±${acc}m)`;
                        triggerDispatch(lat, lng, acc, "Live GPS");
                    },
                    (err) => {
                        console.warn("GPS Access Failed:", err.message);
                        coordsElem.innerText = `Base Location: ${FALLBACK_LAT}, ${FALLBACK_LNG}`;
                        triggerDispatch(FALLBACK_LAT, FALLBACK_LNG, 50, "Default Base Location");
                    },
                    { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
                );
            } else {
                coordsElem.innerText = `Base Location: ${FALLBACK_LAT}, ${FALLBACK_LNG}`;
                triggerDispatch(FALLBACK_LAT, FALLBACK_LNG, 50, "Default Base Location");
            }
        }

        // Initialize immediately upon page load
        window.addEventListener("DOMContentLoaded", () => {
            speakGrounding();
            startHaptics();
            fetchLocation();
        });
    </script>
</body>
</html>
